services:
  - type: web
    name: liafe-project
    plan: free
    runtime: python
    runtimeVersion: 3.11.0
    buildCommand: bash build.sh
    startCommand: gunicorn liafe_project.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        scope: run
        value: django-insecure-change-this-to-a-random-secret-key-in-render-dashboard
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*.onrender.com localhost 127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        scope: run
      - key: CLOUDINARY_CLOUD_NAME
        scope: run
      - key: CLOUDINARY_API_KEY
        scope: run
      - key: CLOUDINARY_API_SECRET
        scope: run
